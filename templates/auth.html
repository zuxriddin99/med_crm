{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>


    <meta charset="utf-8"/>
    <title>Metrica - Admin & Dashboard Template</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta content="Premium Multipurpose Admin & Dashboard Template" name="description"/>
    <meta content="" name="author"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>

    <!-- App favicon -->
    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}">


    <!-- App css -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" type="text/css"/>
    <link href="{% static 'css/icons.min.css' %}" rel="stylesheet" type="text/css"/>
    <link href="{% static 'css/app.min.css' %}" rel="stylesheet" type="text/css"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"/>

</head>

<body id="body" class="auth-page"
      style="background-image: url('{% static 'images/p-1.png' %}'); background-size: cover; background-position: center center;">
<!-- Log In page -->
<div class="container-md">
    <div class="row vh-100 d-flex justify-content-center">
        <div class="col-12 align-self-center">
            <div class="card-body">
                <div class="row">
                    <div class="col-lg-4 mx-auto">
                        <div class="card">
                            <div class="card-body p-0 auth-header-box">
                                <div class="text-center p-3">
                                    <a href="index.html" class="logo logo-admin">
                                        <img src="{% static 'images/logo-sm.png' %}" height="50" alt="logo"
                                             class="auth-logo">
                                    </a>
                                    <h4 class="mt-3 mb-1 fw-semibold text-white font-18">Medical-crm</h4>
                                    <p class="text-muted  mb-0">Tizimga kirish</p>
                                </div>
                            </div>
                            <div class="card-body pt-0">
                                <form class="my-4" action="{% url 'webapp:auth:login' %}" method="post">
                                    {% csrf_token %}
                                    <div class="form-group mb-2">
                                        <label class="form-label" for="card-username">Foydalanuvchi nomi.</label>
                                        <input class="form-control"
                                               id="card-username"
                                               type="text"
                                               placeholder="Foydalanuvchi nomini kiriting"
                                               required
                                               value="{{ username|default:'' }}"
                                               name="username"
                                               oninvalid="this.setCustomValidity('Foydalanuvchi nomi maydonini to\'ldiring')"
                                               oninput="this.setCustomValidity('')"/>
                                    </div><!--end form-group-->

                                    <div class="form-group">
                                        <div class="d-flex justify-content-between">
                                            <label class="form-label" for="card-password">Parol.</label>
                                        </div>
                                        <div class="input-group ">
                                            <input class="form-control"
                                                   id="card-password"
                                                   type="password"
                                                   value="{{ password|default:'' }}"
                                                   required
                                                   placeholder="Parolni kiriting."
                                                   name="password"
                                                   oninvalid="this.setCustomValidity('Parol maydonini to\'ldiring')"
                                                   oninput="this.setCustomValidity('')"/>
                                            <button class="input-group-text material-icons text-secondary "
                                                    type="button"
                                                    onclick="togglePassword()" id="toggle-btn">visibility_off
                                            </button>
                                        </div>
                                    </div><!--end form-group-->

                                    <div class="form-group row mt-3">
                                        <div class="col-sm-6">
                                            <div class="form-check form-switch form-switch-success">
                                                <input class="form-check-input" type="checkbox"
                                                       name="remember_me"
                                                       id="customSwitchSuccess"
                                                >
                                                <label class="form-check-label" for="customSwitchSuccess">Eslab
                                                    qolish</label>
                                            </div>
                                        </div><!--end col-->
                                    </div><!--end form-group-->

                                    <div class="form-group mb-0 row">
                                        <div class="col-12">
                                            <div class="d-grid mt-3">
                                                <button class="btn btn-primary" type="submit">Kirish <i
                                                        class="fas fa-sign-in-alt ms-1"></i></button>
                                            </div>
                                        </div><!--end col-->
                                    </div> <!--end form-group-->
                                </form><!--end form-->
                                <hr class="hr-dashed mt-4">
                                {% include 'parts/alerts.html' %}

                            </div><!--end card-body-->
                        </div><!--end card-->
                    </div><!--end col-->
                </div><!--end row-->
            </div><!--end card-body-->
        </div><!--end col-->
    </div><!--end row-->
</div><!--end container-->
<!-- vendor js -->
<script>
    function togglePassword() {
        var passwordField = document.getElementById("card-password");
        var toggleBtn = document.getElementById("toggle-btn");

        // Check if the password field is of type 'password' or 'text'
        if (passwordField.type === "password") {
            passwordField.type = "text";  // Show the password
            toggleBtn.textContent = "visibility";  // Change button text to "Hide"
        } else {
            passwordField.type = "password";  // Hide the password
            toggleBtn.textContent = "visibility_off";  // Change button text back to "Show"
        }
    }
</script>
<script src="{% static 'libs/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'libs/simplebar/simplebar.min.js' %}"></script>
<script src="{% static 'libs/feather-icons/feather.min.js' %}"></script>
<!-- App js -->
<script src="{% static 'js/app.js' %}"></script>

</body>

</html>
